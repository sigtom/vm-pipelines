# Copy to site.yaml (gitignored). Strings only; no credentials.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vm-provision-config
  namespace: vm-provisioning
data:
  VM_NAMESPACE: vm-provisioning
  NETWORK_ATTACHMENT: REPLACE_ME_EXISTING_NAD
  DATASOURCE_NAME: REPLACE_ME_APPROVED_DATASOURCE
  DATASOURCE_NAMESPACE: openshift-virtualization-os-images
  STORAGE_CLASS: REPLACE_ME_STORAGECLASS
  ACCESS_MODE: REPLACE_ME_ACCESS_MODE         # ReadWriteOnce or ReadWriteMany
  VOLUME_MODE: REPLACE_ME_VOLUME_MODE         # Filesystem or Block
  GUEST_USER: cloud-user
  CLOUD_USER_SUDO: "false"                   # Customer approval required for NOPASSWD
  # Full controller API base. Older direct controller installations use /api/v2.
  AAP_API_BASE_URL: https://REPLACE_ME_AAP_HOST/api/controller/v2
  AAP_JOB_TEMPLATE_ID: REPLACE_ME_NUMERIC_JOB_TEMPLATE_ID
  NETWORK_PROFILE: REPLACE_ME_APPROVED_NETWORK_PROFILE
  AAP_JOB_TIMEOUT_SECONDS: "600"             # Per VM; includes queue/run/read-back
  AAP_POLL_INTERVAL_SECONDS: "5"
  # Gateway/DNS/domain/pool/views are owned by AAP, not copied here.
  # NETWORK_PROFILE must map to the same network as NETWORK_ATTACHMENT.
  # Optional runtime proxy settings (cluster proxy is not inherited automatically):
  # HTTPS_PROXY: http://proxy.example.com:3128
  # HTTP_PROXY: http://proxy.example.com:3128
  # NO_PROXY: .svc,.cluster.local,REPLACE_ME_INTERNAL_ENDPOINTS
