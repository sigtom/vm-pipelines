# Copy to site.yaml (gitignored). Strings only; never put credentials here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vm-provision-config
  namespace: vm-provisioning
data:
  VM_NAMESPACE: vm-provisioning  # Default VM destination, not execution identity.
  NETWORK_ATTACHMENT: REPLACE_ME_EXISTING_NAD
  DATASOURCE_NAME: REPLACE_ME_APPROVED_GOLDEN_DATASOURCE
  DATASOURCE_NAMESPACE: openshift-virtualization-os-images
  STORAGE_CLASS: REPLACE_ME_STORAGECLASS
  ACCESS_MODE: REPLACE_ME_ACCESS_MODE
  VOLUME_MODE: REPLACE_ME_VOLUME_MODE
  MACHINE_TYPE: REPLACE_ME_APPROVED_MACHINE_TYPE
  GUEST_USER: REPLACE_ME_EXISTING_GUEST_USER
  IPAM_URL: https://REPLACE_ME_INFOBLOX_HOST  # Origin only, verified hostname/CA.
  INFOBLOX_WAPI_VERSION: REPLACE_ME_WAPI_VERSION
  # Set subnet only after approval for next-available allocation from the whole subnet.
  INFOBLOX_ALLOCATION_MODE: REPLACE_ME_APPROVED_SUBNET_MODE
  INFOBLOX_NETWORK: REPLACE_ME_IPV4_CIDR
  INFOBLOX_NETWORK_VIEW: REPLACE_ME_NETWORK_VIEW
  GATEWAY: REPLACE_ME_GATEWAY
  DNS_SERVERS: REPLACE_ME_DNS_IPS  # Guest resolvers, comma-separated; not DNS registration.
  DOMAIN: REPLACE_ME_DNS_SEARCH_DOMAIN
  # No DNS view, STATIC_START/END or DHCP range fields are consumed by 0.4.
  # Infoblox must already exclude/reserve infrastructure and DHCP-owned addresses.
  # Network workspace profiles override the complete network configuration above.
  # Optional runtime proxy settings (not inherited automatically):
  # HTTPS_PROXY: http://proxy.example.com:3128
  # HTTP_PROXY: http://proxy.example.com:3128
  # NO_PROXY: .svc,.cluster.local,REPLACE_ME_INTERNAL_ENDPOINTS
