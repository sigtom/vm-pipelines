name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: '4.21'
      - name: Test dependencies (not used in the runtime image)
        run: python -m pip install PyYAML==6.0.3
      - name: Tests and native rendering, without cluster access
        env:
          REQUIRE_OC: '1'
        run: |
          oc version --client
          python -m unittest discover -s tests -v
          python -S -m unittest discover -s tests -p test_ipam.py -v
          git diff --check
