# Request runs centrally. The separate TARGET_NAMESPACE controls VM placement.
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: vm-provision-request
  namespace: vm-provisioning
  annotations:
    openshift.io/display-name: Request RHEL VM
    description: >-
      Request one to five RHEL VMs from the approved golden image.
      Root disks: small 110Gi, medium 500Gi, large 1Ti. Count: 1-5.
      Keep the top Namespace selector on the provisioning project.
      Target VM namespace is the approved destination for VMs and their disks.
      SSH key is added to the existing approved guest account. Labels are optional.
      Creates a real PipelineRun; Infoblox configuration must be ready.
    tags: rhel,vm,virtualization,request,pipeline
    iconClass: icon-rhel
objects:
  - apiVersion: tekton.dev/v1
    kind: PipelineRun
    metadata:
      name: vm-request-${VM_NAME}
    spec:
      pipelineRef:
        name: vm-provision
      taskRunTemplate:
        serviceAccountName: vm-provision
      workspaces:
        - name: scratch
          emptyDir: {}
      params:
        - name: vm-name
          value: ${VM_NAME}
        - name: size
          value: ${SIZE}
        - name: count
          value: ${COUNT}
        - name: ssh-public-key
          value: ${SSH_PUBLIC_KEY}
        - name: vm-labels
          value: ${VM_LABELS}
        - name: target-namespace
          value: ${TARGET_NAMESPACE}
parameters:
  - name: VM_NAME
    displayName: VM name
    description: Unused VM name or batch base name; lowercase letters, digits, hyphens.
    required: true
  - name: SIZE
    displayName: Size
    description: "small: 2 vCPU / 4Gi RAM / 110Gi disk; medium: 4 / 8Gi / 500Gi; large: 8 / 16Gi / 1Ti."
    value: small
    required: true
  - name: COUNT
    displayName: Count
    description: Number of identical VMs (1-5)
    value: "1"
    required: true
  - name: SSH_PUBLIC_KEY
    displayName: SSH public key
    description: An OpenSSH ed25519 public key for the approved existing guest account, not a private key.
    required: true
  - name: VM_LABELS
    displayName: Additional VM labels
    description: "Optional. Separate labels with semicolons: foo=bar;boo=far. Applied to all VMs in this request."
    value: ""
    required: false
  - name: TARGET_NAMESPACE
    displayName: Target VM namespace
    description: Existing approved destination with the selected NAD and instance types. Keep the top Namespace selector on vm-provisioning.
    value: vm-provisioning
    required: true
