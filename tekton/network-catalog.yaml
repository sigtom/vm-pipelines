# ADMIN AUTHORING TEMPLATE: process locally; do not install this wrapper.
# Output: a disabled network ConfigMap and a catalog request Template, not a live run.
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: vm-network-catalog-entry
parameters:
  - name: NETWORK_ATTACHMENT
    description: Approved NAD name; must also exist in each chosen target VM namespace.
    required: true
  - name: REQUEST_TEMPLATE_NAME
    description: Unique request Template resource name; reuse the old name only for its migration.
    required: true
  - name: DISPLAY_NAME
    description: Operator-facing catalog title.
    required: true
  - name: NAMESPACE
    description: Central provisioning namespace, not the VM destination.
    value: vm-provisioning
    required: true
objects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: vm-network-${NETWORK_ATTACHMENT}
      namespace: ${NAMESPACE}
      labels:
        app.kubernetes.io/part-of: vm-pipelines
        vm-pipelines/network: ${NETWORK_ATTACHMENT}
    data:
      PROFILE_ENABLED: "false"
      NETWORK_ATTACHMENT: ${NETWORK_ATTACHMENT}
      # Explicit opt-in for the entire subnet; Infoblox owns availability/exclusions.
      INFOBLOX_ALLOCATION_MODE: subnet
      INFOBLOX_NETWORK: REPLACE_ME_IPV4_CIDR
      INFOBLOX_NETWORK_VIEW: REPLACE_ME_NETWORK_VIEW
      GATEWAY: REPLACE_ME_GATEWAY
      DNS_SERVERS: REPLACE_ME_COMMA_SEPARATED_DNS_IPS
      DOMAIN: REPLACE_ME_DNS_DOMAIN
  - apiVersion: template.openshift.io/v1
    kind: Template
    metadata:
      name: ${REQUEST_TEMPLATE_NAME}
      namespace: ${NAMESPACE}
      labels:
        app.kubernetes.io/part-of: vm-pipelines
        vm-pipelines/network: ${NETWORK_ATTACHMENT}
      annotations:
        openshift.io/display-name: ${DISPLAY_NAME}
        description: >-
          Provision one to five RHEL VMs on ${NETWORK_ATTACHMENT} using its approved
          IPAM-only Infoblox profile. Small 110Gi, medium 500Gi, large 1Ti root disks.
          Keep the top Namespace selector on ${NAMESPACE}; use Target VM namespace
          for the destination. Network provisioning stays blocked until enabled.
        tags: rhel,vm,virtualization,request,pipeline
        iconClass: icon-rhel
    objects:
      - apiVersion: tekton.dev/v1
        kind: PipelineRun
        metadata:
          name: vm-request-${VM_NAME}
        spec:
          pipelineRef:
            name: vm-provision
          taskRunTemplate:
            serviceAccountName: vm-provision
          workspaces:
            - name: scratch
              emptyDir: {}
            - name: network
              configMap:
                name: vm-network-${NETWORK_ATTACHMENT}
          params:
            - name: vm-name
              value: ${VM_NAME}
            - name: size
              value: ${SIZE}
            - name: count
              value: ${COUNT}
            - name: ssh-public-key
              value: ${SSH_PUBLIC_KEY}
            - name: vm-labels
              value: ${VM_LABELS}
            - name: target-namespace
              value: ${TARGET_NAMESPACE}
    parameters:
      - name: VM_NAME
        displayName: VM name
        description: Unused VM name or batch base name; lowercase letters, digits, hyphens.
        required: true
      - name: SIZE
        displayName: Size
        description: "small: 2 vCPU / 4Gi RAM / 110Gi disk; medium: 4 / 8Gi / 500Gi; large: 8 / 16Gi / 1Ti."
        value: small
        required: true
      - name: COUNT
        displayName: Count
        description: Number of identical VMs (1-5)
        value: "1"
        required: true
      - name: SSH_PUBLIC_KEY
        displayName: SSH public key
        description: One OpenSSH Ed25519 or RSA public key (RSA at least 2048 bits) for the existing guest account. Public key only; used for every VM in the request.
        required: true
      - name: VM_LABELS
        displayName: Additional VM labels
        description: "Optional. Separate labels with semicolons: foo=bar;boo=far. Applied to every VM in the request."
        value: ""
        required: false
      - name: TARGET_NAMESPACE
        displayName: Target VM namespace
        description: Existing approved VM destination with the selected NAD and instance types. Keep the top Namespace selector on ${NAMESPACE}.
        value: ${NAMESPACE}
        required: true
