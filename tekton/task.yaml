# Central execution; only reserve-ip receives the Infoblox credential Secret.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: vm-provision
  namespace: vm-provisioning
spec:
  params:
    - name: vm-name
      type: string
    - name: size
      type: string
    - name: count
      type: string
    - name: ssh-public-key
      type: string
    - name: vm-labels
      type: string
      default: ""
      description: Optional semicolon-separated key=value labels for VM metadata.
    - name: target-namespace
      type: string
      default: ""
      description: Approved VM destination; empty uses the site's VM_NAMESPACE default.
    # ADMIN-ONLY image settings: change defaults before applying the Task.
    - name: cli-image
      type: string
      default: REPLACE_ME_CLI_IMAGE_BY_DIGEST
    - name: ipam-image
      type: string
      default: REPLACE_ME_BUILT_IPAM_IMAGE_BY_DIGEST
  workspaces:
    - name: scratch
    - name: network
      optional: true
      readOnly: true
      description: A complete approved network profile. Omit only for legacy single-network requests.
  volumes:
    - name: ipam-ca
      configMap:
        name: vm-ipam-ca
        optional: true
  stepTemplate:
    env:
      - name: HOME
        value: /tmp
      - name: DOCKER_CONFIG
        value: /tmp/.docker
    workingDir: $(workspaces.scratch.path)
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
  steps:
    - name: validate-key
      image: $(params.ipam-image)
      env:
        - name: REQ_SSH_KEY
          value: $(params.ssh-public-key)
      script: |
        #!/usr/bin/env sh
        set -eu
        # Refuse the older DNS-enabled helper before any allocation.
        test "$(python3 /opt/vm/ipam.py --version)" = "vm-ipam 0.4: IPAM-only subnet allocation"
        python3 /opt/vm/ipam.py check-ssh-key
    - name: preflight
      image: $(params.cli-image)
      envFrom:
        - configMapRef:
            name: vm-provision-config
      env:
        - name: REQ_NAME
          value: $(params.vm-name)
        - name: REQ_SIZE
          value: $(params.size)
        - name: REQ_COUNT
          value: $(params.count)
        - name: REQ_LABELS
          value: $(params.vm-labels)
        - name: REQ_TARGET_NAMESPACE
          value: $(params.target-namespace)
        - name: EXECUTION_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: SCRATCH
          value: $(workspaces.scratch.path)
        - name: NETWORK_PROFILE_BOUND
          value: $(workspaces.network.bound)
        - name: NETWORK_PROFILE_PATH
          value: $(workspaces.network.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        export LC_ALL=C
        fail() { echo "ERROR: $*" >&2; exit 1; }
        # Binary quantities: 110G decimal is smaller than a 104Gi source.
        case "$REQ_SIZE" in
          small) DISK_SIZE=110Gi ;;
          medium) DISK_SIZE=500Gi ;;
          large) DISK_SIZE=1Ti ;;
          *) fail "size must be small, medium, or large" ;;
        esac
        case "$REQ_COUNT" in
          1|2|3|4|5) ;;
          *) fail "count must be between 1 and 5" ;;
        esac
        [[ "$REQ_NAME" =~ ^[a-z][a-z0-9-]{0,54}[a-z0-9]$ ]] || fail "invalid VM name"

        # Execution identity/configuration stay central. Only the destination changes.
        # The fallback supports local script tests; Pods get their actual namespace
        # from the downward API, not from the request or a network profile.
        EXECUTION_NAMESPACE=${EXECUTION_NAMESPACE:-${VM_NAMESPACE:?missing site VM_NAMESPACE}}
        VM_NAMESPACE=${REQ_TARGET_NAMESPACE:-${VM_NAMESPACE:-}}
        [[ "$VM_NAMESPACE" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ && ${#VM_NAMESPACE} -le 63 ]] || fail "invalid target namespace"
        case "$VM_NAMESPACE" in
          default|kube-*|openshift|openshift-*) fail "system namespaces are not VM provisioning targets" ;;
        esac

        # Snapshot one complete network profile; never fall back to another network.
        if [[ "${NETWORK_PROFILE_BOUND:-false}" == true ]]; then
          profile=${NETWORK_PROFILE_PATH:?missing network workspace path}
          if [[ -L "$profile/..data" ]]; then
            profile=$(readlink -f "$profile/..data") || fail "cannot resolve network profile"
          fi
          enabled=$(cat "$profile/PROFILE_ENABLED") || fail "missing PROFILE_ENABLED"
          [[ "$enabled" == true ]] || fail "network profile is disabled pending administrator approval"
          [[ ! -e "$SCRATCH/network.env" ]] || fail "network snapshot already exists; do not retry automatically"
          umask 077
          : > "$SCRATCH/network.env.tmp"
          for key in NETWORK_ATTACHMENT INFOBLOX_ALLOCATION_MODE INFOBLOX_NETWORK INFOBLOX_NETWORK_VIEW GATEWAY DNS_SERVERS DOMAIN; do
            value=$(cat "$profile/$key") || fail "network profile is missing $key"
            [[ "$value" != *$'\n'* && "$value" != *$'\r'* && "$value" != *REPLACE_ME* ]] || fail "invalid or placeholder network setting: $key"
            [[ -n "$value" ]] || fail "empty network setting: $key"
            # Literal data, never shell source; unknown keys cannot override namespaces.
            printf '%s=%s\n' "$key" "$value" >> "$SCRATCH/network.env.tmp"
            export "$key=$value"
          done
          [[ "$NETWORK_ATTACHMENT" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ && ${#NETWORK_ATTACHMENT} -le 63 ]] || fail "invalid profile NAD name"
          [[ "$INFOBLOX_ALLOCATION_MODE" == subnet ]] || fail "approve subnet allocation before enabling this profile"
          mv "$SCRATCH/network.env.tmp" "$SCRATCH/network.env"
        elif [[ "${NETWORK_PROFILE_BOUND:-false}" != false ]]; then
          fail "invalid network workspace state"
        fi

        for setting in VM_NAMESPACE EXECUTION_NAMESPACE NETWORK_ATTACHMENT DATASOURCE_NAME DATASOURCE_NAMESPACE STORAGE_CLASS ACCESS_MODE VOLUME_MODE MACHINE_TYPE GUEST_USER IPAM_URL; do
          [[ -n "${!setting:-}" && "${!setting}" != *REPLACE_ME* ]] || fail "missing site setting: $setting"
        done
        case "$ACCESS_MODE" in ReadWriteOnce|ReadWriteMany) ;; *) fail "unsupported ACCESS_MODE" ;; esac
        case "$VOLUME_MODE" in Filesystem|Block) ;; *) fail "unsupported VOLUME_MODE" ;; esac
        [[ "$MACHINE_TYPE" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$ ]] || fail "invalid MACHINE_TYPE"
        [[ "$GUEST_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ && "$GUEST_USER" != root ]] || fail "invalid non-root GUEST_USER"
        [[ "${CLOUD_USER_SUDO:-false}" == false ]] || fail "CLOUD_USER_SUDO is no longer supported; preserve the golden image account policy"

        # Parse labels as data, never shell code. Reject invalid input before IPAM.
        trim() {
          local s=$1
          s="${s#"${s%%[![:space:]]*}"}"
          s="${s%"${s##*[![:space:]]}"}"
          printf '%s' "$s"
        }
        labels=()
        declare -A label_keys=()
        raw_labels=${REQ_LABELS:-}
        [[ "$raw_labels" != *$'\n'* && "$raw_labels" != *$'\r'* ]] || fail "labels must be one line"
        raw_labels=$(trim "$raw_labels")
        if [[ -n "$raw_labels" ]]; then
          [[ "$raw_labels" != ';'* && "$raw_labels" != *';' ]] || fail "empty label entry"
          IFS=';' read -r -a entries <<< "$raw_labels"
          label_pattern='^[A-Za-z0-9]([A-Za-z0-9_.-]*[A-Za-z0-9])?$'
          prefix_pattern='^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
          for entry in "${entries[@]}"; do
            [[ "$entry" == *=* ]] || fail "each label must be key=value"
            key=$(trim "${entry%%=*}")
            value=$(trim "${entry#*=}")
            name=${key##*/}
            [[ ${#name} -le 63 && "$name" =~ $label_pattern ]] || fail "invalid label key"
            if [[ "$key" == */* ]]; then
              prefix=${key%/*}
              [[ ${#prefix} -le 253 && "$prefix" =~ $prefix_pattern ]] || fail "invalid label prefix"
            fi
            [[ ${#value} -le 63 && ( -z "$value" || "$value" =~ $label_pattern ) ]] || fail "invalid label value"
            [[ -z "${label_keys[$key]+set}" ]] || fail "duplicate label key: $key"
            label_keys["$key"]=1
            labels+=("$key=$value")
          done
        fi

        # An authorization/API failure is never interpreted as 'not found'.
        exists() {
          local found
          found=$(oc -n "$1" get "$2" "$3" --ignore-not-found -o name) \
            || fail "cannot read $2 $3 in $1"
          [[ -n "$found" ]] || fail "$2 $3 not found in $1"
        }
        can_i() {
          local args=("$2" "$3" -n "$1") answer
          [[ -z "${4:-}" ]] || args+=("--subresource=$4")
          answer=$(oc auth can-i "${args[@]}") || true
          [[ "$answer" == yes ]] || fail "ServiceAccount may not $2 $3 ${4:-} in $1"
        }
        bytes() {
          [[ "$1" =~ ^([0-9]{1,12})(Ki|Mi|Gi|Ti)?$ ]] || return 1
          local n=$((10#${BASH_REMATCH[1]}))
          case "${BASH_REMATCH[2]}" in
            Ki) echo $((n * 1024)) ;; Mi) echo $((n * 1048576)) ;;
            Gi) echo $((n * 1073741824)) ;; Ti) echo $((n * 1099511627776)) ;;
            *) echo "$n" ;;
          esac
        }
        # The trusted VM definition stays in the execution namespace.
        exists "$EXECUTION_NAMESPACE" templates.template.openshift.io rhel-standard
        if (( ${#labels[@]} )); then
          managed=$(oc -n "$EXECUTION_NAMESPACE" get templates.template.openshift.io rhel-standard \
            -o go-template='{{range .objects}}{{if eq .kind "VirtualMachine"}}{{range $key, $value := .metadata.labels}}{{$key}}{{"\n"}}{{end}}{{end}}{{end}}') \
            || fail "cannot read Template-managed labels"
          while IFS= read -r key; do
            [[ -n "$key" ]] || continue
            [[ -z "${label_keys[$key]+set}" ]] || fail "label $key is managed by the VM Template"
          done <<< "$managed"
        fi
        # Approval is a scoped target RoleBinding for this central ServiceAccount.
        can_i "$VM_NAMESPACE" create virtualmachines.kubevirt.io
        exists "$VM_NAMESPACE" virtualmachineinstancetypes.instancetype.kubevirt.io "poc-$REQ_SIZE"
        exists "$VM_NAMESPACE" network-attachment-definitions.k8s.cni.cncf.io "$NETWORK_ATTACHMENT"
        source=$(oc -n "$DATASOURCE_NAMESPACE" get datasources.cdi.kubevirt.io "$DATASOURCE_NAME" \
          --ignore-not-found \
          -o 'jsonpath={.status.conditions[?(@.type=="Ready")].status}|{.status.source.pvc.name}|{.status.source.pvc.namespace}') \
          || fail "cannot read DataSource $DATASOURCE_NAME"
        [[ -n "$source" ]] || fail "DataSource not found"
        IFS='|' read -r ready pvc_name pvc_ns <<< "$source"
        pvc_ns=${pvc_ns:-$DATASOURCE_NAMESPACE}
        [[ "$ready" == True && -n "$pvc_name" ]] || fail "DataSource is not Ready or has no source PVC"
        pvc=$(oc -n "$pvc_ns" get persistentvolumeclaims "$pvc_name" --ignore-not-found \
          -o 'jsonpath={.status.phase}|{.spec.storageClassName}|{.spec.volumeMode}|{.status.capacity.storage}') \
          || fail "cannot read source PVC $pvc_name in $pvc_ns"
        [[ -n "$pvc" ]] || fail "source PVC not found"
        IFS='|' read -r phase src_class src_mode src_size <<< "$pvc"
        [[ "$phase" == Bound ]] || fail "source PVC is not Bound"
        [[ "$src_class" == "$STORAGE_CLASS" && "$src_mode" == "$VOLUME_MODE" ]] \
          || fail "source storage class/volume mode differs from approved target"
        src_bytes=$(bytes "$src_size") || fail "unrecognised source PVC capacity"
        disk_bytes=$(bytes "$DISK_SIZE")
        (( src_bytes <= disk_bytes )) || fail "source PVC is larger than target disk"
        can_i "$pvc_ns" create datavolumes.cdi.kubevirt.io source
        names=""
        for ((i=1; i<=REQ_COUNT; i++)); do
          name="$REQ_NAME"
          if (( REQ_COUNT > 1 )); then printf -v name '%s-%03d' "$REQ_NAME" "$i"; fi
          found=$(oc -n "$VM_NAMESPACE" get virtualmachines.kubevirt.io "$name" --ignore-not-found -o name) \
            || fail "cannot read VM $name"
          [[ -z "$found" ]] || fail "VM $name already exists. No IP allocated."
          for kind in datavolumes.cdi.kubevirt.io persistentvolumeclaims; do
            found=$(oc -n "$VM_NAMESPACE" get "$kind" "$name-root" --ignore-not-found -o name) \
              || fail "cannot read $kind $name-root"
            [[ -z "$found" ]] || fail "$kind $name-root already exists. No IP allocated."
          done
          names+="$name"$'\n'
        done
        : > "$SCRATCH/labels"
        if (( ${#labels[@]} )); then printf '%s\n' "${labels[@]}" > "$SCRATCH/labels"; fi
        printf '%s' "$names" > "$SCRATCH/names"
        printf '%s\n' "$DISK_SIZE" > "$SCRATCH/disk-size"
        # Freeze the validated destination; later ConfigMap edits cannot move the VM.
        printf '%s\n' "$VM_NAMESPACE" > "$SCRATCH/target-namespace"
        echo "Preflight passed for VM namespace $VM_NAMESPACE; no IPAM changes yet."
    - name: reserve-ip
      image: $(params.ipam-image)
      volumeMounts:
        - name: ipam-ca
          mountPath: /etc/ipam-ca
          readOnly: true
      envFrom:
        - configMapRef:
            name: vm-provision-config
        - secretRef:
            name: vm-ipam-credentials
      env:
        - name: VM_NAMES_FILE
          value: $(workspaces.scratch.path)/names
        - name: ALLOCATIONS_FILE
          value: $(workspaces.scratch.path)/allocations
        - name: SCRATCH
          value: $(workspaces.scratch.path)
        - name: NETWORK_PROFILE_BOUND
          value: $(workspaces.network.bound)
      script: |
        #!/usr/bin/env sh
        set -eu
        umask 077
        if [ "${NETWORK_PROFILE_BOUND:-false}" = true ]; then
          test -s "$SCRATCH/network.env" || { echo "Missing validated network snapshot" >&2; exit 1; }
          while IFS='=' read -r key value; do
            export "$key=$value"
          done < "$SCRATCH/network.env"
        fi
        if [ -f /etc/ipam-ca/ca-bundle.crt ]; then
          export SSL_CERT_FILE=/etc/ipam-ca/ca-bundle.crt
        fi
        python3 /opt/vm/ipam.py
    - name: create-vms
      image: $(params.cli-image)
      envFrom:
        - configMapRef:
            name: vm-provision-config
      env:
        - name: REQ_SIZE
          value: $(params.size)
        - name: REQ_SSH_KEY
          value: $(params.ssh-public-key)
        - name: EXECUTION_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: SCRATCH
          value: $(workspaces.scratch.path)
        - name: NETWORK_PROFILE_BOUND
          value: $(workspaces.network.bound)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        if [[ "${NETWORK_PROFILE_BOUND:-false}" == true ]]; then
          [[ -s "$SCRATCH/network.env" ]] || { echo "Missing validated network snapshot" >&2; exit 1; }
          while IFS='=' read -r key value; do
            export "$key=$value"
          done < "$SCRATCH/network.env"
        fi
        EXECUTION_NAMESPACE=${EXECUTION_NAMESPACE:-${VM_NAMESPACE:?missing site VM_NAMESPACE}}
        [[ -s "$SCRATCH/target-namespace" ]] || { echo "Missing validated target namespace" >&2; exit 1; }
        VM_NAMESPACE=$(< "$SCRATCH/target-namespace")
        [[ "$VM_NAMESPACE" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ && ${#VM_NAMESPACE} -le 63 ]] || { echo "Invalid target namespace snapshot" >&2; exit 1; }
        disk=$(< "$SCRATCH/disk-size")
        mapfile -t labels < "$SCRATCH/labels"
        oc -n "$EXECUTION_NAMESPACE" get templates.template.openshift.io rhel-standard -o yaml > "$SCRATCH/template.yaml"
        [[ -s "$SCRATCH/allocations" ]] || { echo "No allocation receipt" >&2; exit 1; }
        while IFS='|' read -r name address mac gateway dns domain; do
          [[ -n "$name" && -n "$address" ]] || { echo "Invalid allocation receipt" >&2; exit 1; }
          oc process --local -f "$SCRATCH/template.yaml" -o yaml \
            -p "VM_NAME=$name" -p "VM_NAMESPACE=$VM_NAMESPACE" \
            -p "VM_SIZE=$REQ_SIZE" -p "INSTANCE_TYPE=poc-$REQ_SIZE" \
            -p "DISK_SIZE=$disk" -p "STORAGE_CLASS=$STORAGE_CLASS" \
            -p "ACCESS_MODE=$ACCESS_MODE" -p "VOLUME_MODE=$VOLUME_MODE" \
            -p "DATASOURCE_NAME=$DATASOURCE_NAME" -p "DATASOURCE_NAMESPACE=$DATASOURCE_NAMESPACE" \
            -p "MACHINE_TYPE=$MACHINE_TYPE" \
            -p "NETWORK_ATTACHMENT=$NETWORK_ATTACHMENT" -p "GUEST_USER=$GUEST_USER" \
            -p "MAC_ADDRESS=$mac" -p "IP_CIDR=$address" -p "GATEWAY=$gateway" \
            -p "DNS_SERVERS=$dns" -p "DOMAIN=$domain" -p "SSH_PUBLIC_KEY=$REQ_SSH_KEY" \
            > "$SCRATCH/$name.yaml"
          if (( ${#labels[@]} )); then
            if ! oc label --local --overwrite=false -f "$SCRATCH/$name.yaml" \
              -o yaml -- "${labels[@]}" > "$SCRATCH/$name.labeled.yaml"; then
              echo "FAILED: cannot add VM labels; reservations remain. Reconcile before retrying." >&2
              exit 1
            fi
            mv "$SCRATCH/$name.labeled.yaml" "$SCRATCH/$name.yaml"
          fi
          if ! oc -n "$VM_NAMESPACE" create -f "$SCRATCH/$name.yaml"; then
            echo "FAILED: reservations remain. Inspect $VM_NAMESPACE/$name and reconcile before retrying." >&2
            exit 1
          fi
        done < "$SCRATCH/allocations"
