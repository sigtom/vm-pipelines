apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: vm-provision
  namespace: vm-provisioning
spec:
  description: Request networking from AAP, then create one to five VMs from the native Template.
  params:
    - name: vm-name
      type: string
      description: Unused VM name or batch base name
    - name: size
      type: string
      description: small, medium, or large
    - name: count
      type: string
      default: "1"
      description: Number of VMs (1-5); batches have numbered suffixes
    - name: ssh-public-key
      type: string
      description: OpenSSH ed25519 public key
    - name: vm-labels
      type: string
      default: ""
      description: Optional semicolon-separated key=value labels for VM metadata.
  workspaces:
    - name: scratch
  tasks:
    - name: provision
      timeout: 60m
      taskRef:
        kind: Task
        name: vm-provision
      params:
        - name: vm-name
          value: $(params.vm-name)
        - name: size
          value: $(params.size)
        - name: count
          value: $(params.count)
        - name: ssh-public-key
          value: $(params.ssh-public-key)
        - name: vm-labels
          value: $(params.vm-labels)
        # Correlation only, not a user input or an automatic retry mechanism.
        - name: request-id
          value: $(context.pipelineRun.uid)
      workspaces:
        - name: scratch
          workspace: scratch
