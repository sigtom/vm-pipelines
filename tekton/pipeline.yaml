apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: vm-provision
  namespace: vm-provisioning
spec:
  description: Create one to five VMs in an approved target namespace using central provisioning resources.
  params:
    - name: vm-name
      type: string
      description: Unused VM name or batch base name
    - name: size
      type: string
      description: small, medium, or large
    - name: count
      type: string
      default: "1"
      description: Number of VMs (1-5); batches have numbered suffixes
    - name: ssh-public-key
      type: string
      description: OpenSSH Ed25519 or RSA public key (RSA at least 2048 bits); one key for all VMs in the request.
    - name: vm-labels
      type: string
      default: ""
      description: "Optional VM labels separated by semicolons, e.g. foo=bar;boo=far. Applied to every VM in the request."
    - name: target-namespace
      type: string
      default: ""
      description: Approved VM destination. Empty preserves the administrator's VM_NAMESPACE default.
  workspaces:
    - name: scratch
    - name: network
      optional: true
      description: Administrator-selected network ConfigMap, fixed by the catalog entry.
  tasks:
    - name: provision
      taskRef:
        kind: Task
        name: vm-provision
      params:
        - name: vm-name
          value: $(params.vm-name)
        - name: size
          value: $(params.size)
        - name: count
          value: $(params.count)
        - name: ssh-public-key
          value: $(params.ssh-public-key)
        - name: vm-labels
          value: $(params.vm-labels)
        - name: target-namespace
          value: $(params.target-namespace)
      workspaces:
        - name: scratch
          workspace: scratch
        - name: network
          workspace: network
