# Same execution and VM namespace for the MVP. No operator-user RBAC is granted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vm-provision
  namespace: vm-provisioning
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vm-provision
  namespace: vm-provisioning
rules:
  - apiGroups: [kubevirt.io]
    resources: [virtualmachines]
    verbs: [get, create]
  - apiGroups: [cdi.kubevirt.io]
    resources: [datavolumes]
    verbs: [get]
  - apiGroups: [template.openshift.io]
    resources: [templates]
    verbs: [get]
  - apiGroups: [instancetype.kubevirt.io]
    resources: [virtualmachineinstancetypes]
    verbs: [get]
  - apiGroups: [k8s.cni.cncf.io]
    resources: [network-attachment-definitions]
    verbs: [get]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vm-provision
  namespace: vm-provisioning
subjects:
  - kind: ServiceAccount
    name: vm-provision
    namespace: vm-provisioning
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vm-provision
---
# Match the actual DataSource AND source PVC namespaces; duplicate only these
# source Role/RoleBinding objects if they live in different namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vm-provision-source-reader
  namespace: openshift-virtualization-os-images
rules:
  - apiGroups: [cdi.kubevirt.io]
    resources: [datasources]
    verbs: [get]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get]
  - apiGroups: [cdi.kubevirt.io]
    resources: [datavolumes/source]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vm-provision-source-reader
  namespace: openshift-virtualization-os-images
subjects:
  - kind: ServiceAccount
    name: vm-provision
    namespace: vm-provisioning
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vm-provision-source-reader
