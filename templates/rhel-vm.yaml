# Native BIOS/VirtIO VM definition for a prepared golden image.
# The existing guest account owns password/groups/sudo policy; only add its SSH key.
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: rhel-standard
  namespace: vm-provisioning
  labels:
    app.kubernetes.io/part-of: vm-pipelines
parameters:
  - name: VM_NAME
    required: true
  - name: VM_NAMESPACE
    required: true
  - name: VM_SIZE
    required: true
  - name: INSTANCE_TYPE
    required: true
  - name: DISK_SIZE
    required: true
  - name: STORAGE_CLASS
    required: true
  - name: ACCESS_MODE
    required: true
  - name: VOLUME_MODE
    required: true
  - name: DATASOURCE_NAME
    required: true
  - name: DATASOURCE_NAMESPACE
    required: true
  - name: MACHINE_TYPE
    description: Approved QEMU machine type from the working golden-image VM.
    required: true
  - name: NETWORK_ATTACHMENT
    required: true
  - name: MAC_ADDRESS
    required: true
  - name: IP_CIDR
    required: true
  - name: GATEWAY
    required: true
  - name: DNS_SERVERS
    required: true
  - name: DOMAIN
    required: true
  - name: GUEST_USER
    description: Existing non-root account in the golden image; no account is created.
    required: true
  - name: SSH_PUBLIC_KEY
    required: true
objects:
  - apiVersion: kubevirt.io/v1
    kind: VirtualMachine
    metadata:
      name: ${VM_NAME}
      namespace: ${VM_NAMESPACE}
      labels:
        app.kubernetes.io/managed-by: tekton-vm-provision
        app.kubernetes.io/part-of: vm-pipelines
        vm-pipelines/size: ${VM_SIZE}
        vm-pipelines/os: rhel
    spec:
      runStrategy: Always
      instancetype:
        kind: VirtualMachineInstancetype
        name: ${INSTANCE_TYPE}
      dataVolumeTemplates:
        - metadata:
            name: ${VM_NAME}-root
          spec:
            sourceRef:
              kind: DataSource
              name: ${DATASOURCE_NAME}
              namespace: ${DATASOURCE_NAMESPACE}
            storage:
              storageClassName: ${STORAGE_CLASS}
              accessModes:
                - ${ACCESS_MODE}
              volumeMode: ${VOLUME_MODE}
              resources:
                requests:
                  storage: ${DISK_SIZE}
      template:
        metadata:
          labels:
            kubevirt.io/domain: ${VM_NAME}
        spec:
          terminationGracePeriodSeconds: 180
          domain:
            machine:
              type: ${MACHINE_TYPE}
            firmware:
              bootloader:
                bios: {}
            devices:
              disks:
                - name: rootdisk
                  bootOrder: 1
                  disk:
                    bus: virtio
                - name: cloudinitdisk
                  disk:
                    bus: virtio
              interfaces:
                - name: lan
                  model: virtio
                  bridge: {}
                  macAddress: "${MAC_ADDRESS}"
          networks:
            - name: lan
              multus:
                networkName: ${NETWORK_ATTACHMENT}
          volumes:
            - name: rootdisk
              dataVolume:
                name: ${VM_NAME}-root
            - name: cloudinitdisk
              cloudInitNoCloud:
                userData: |
                  #cloud-config
                  hostname: ${VM_NAME}
                  fqdn: ${VM_NAME}.${DOMAIN}
                  preserve_hostname: false
                  # Do not invoke user creation/locking/sudo defaults on existing accounts.
                  users: []
                  write_files:
                    - path: /run/vm-provision-public-key
                      owner: root:root
                      permissions: '0600'
                      content: |-
                        ${SSH_PUBLIC_KEY}
                  runcmd:
                    - |
                      set -eu
                      user='${GUEST_USER}'
                      uid=$(id -u "$user")
                      test "$uid" -ne 0
                      home=$(getent passwd "$user" | cut -d: -f6)
                      case "$home" in /*) ;; *) exit 1 ;; esac
                      test -d "$home"
                      group=$(id -gn "$user")
                      keys="$home/.ssh/authorized_keys"
                      test ! -L "$home/.ssh" && test ! -L "$keys"
                      install -d -m 0700 -o "$user" -g "$group" "$home/.ssh"
                      touch "$keys"
                      chown "$user:$group" "$keys"
                      chmod 0600 "$keys"
                      if ! grep -qxFf /run/vm-provision-public-key "$keys"; then
                        printf '\n' >> "$keys"
                        cat /run/vm-provision-public-key >> "$keys"
                        printf '\n' >> "$keys"
                      fi
                      restorecon -RF "$home/.ssh"
                      rm -f /run/vm-provision-public-key
                  # No password/group/sudo/sshd policy edits, Salt bootstrap, or LVM resizing.
                networkData: |
                  version: 2
                  ethernets:
                    lan:
                      match:
                        macaddress: "${MAC_ADDRESS}"
                      set-name: eth0
                      addresses:
                        - ${IP_CIDR}
                      routes:
                        - to: 0.0.0.0/0
                          via: ${GATEWAY}
                      nameservers:
                        addresses: [${DNS_SERVERS}]
                        search:
                          - ${DOMAIN}
